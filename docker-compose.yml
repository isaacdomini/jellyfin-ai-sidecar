version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jellyfin-ai-sidecar
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=jellyfin_user
      - POSTGRES_PASSWORD=jellyfin_pass
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=jellyfin_ai
      - DATABASE_URL=postgresql://jellyfin_user:jellyfin_pass@db:5432/jellyfin_ai
      - CHUNK_SIZE_SECONDS=30
      - CHUNK_OVERLAP_SECONDS=5
      - EMBEDDING_DIMENSION=768
    volumes:
      - ./app:/app/app
      # Option to mount Jellyfin media folder if accessible to container
      # - /path/to/jellyfin/media:/media:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: jellyfin-ai-db
    environment:
      - POSTGRES_USER=jellyfin_user
      - POSTGRES_PASSWORD=jellyfin_pass
      - POSTGRES_DB=jellyfin_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jellyfin_user -d jellyfin_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
